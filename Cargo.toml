[package]
name = "dpi-bypass"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
tokio              = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "signal", "sync"] }
rustls             = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots       = "0.26"
tokio-tungstenite  = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util       = { version = "0.3", default-features = false, features = ["sink", "std"] }
# MTProto obfuscated2 (AES-256-CTR) + QUIC Initial decryption (AES-128-GCM / HKDF)
aes                = "0.8"
ctr                = "0.9"
aes-gcm            = "0.10"
hkdf               = "0.12"
sha2               = "0.10"
# WinDivert is loaded at runtime from an embedded, extracted DLL => single .exe
libloading         = "0.8"
arc-swap           = "1"
fastrand           = "2"
hex                = "0.4"
anyhow             = "1"
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Build:  cargo build --release --target x86_64-pc-windows-msvc
# Put WinDivert 2.2.x x64 files in ./vendor/ before building:
#   vendor/WinDivert.dll   vendor/WinDivert64.sys
# Run elevated (the driver needs Administrator).
