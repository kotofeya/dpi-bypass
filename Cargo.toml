[package]
name = "dpi-bypass"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
build = "build.rs"

[dependencies]
tokio              = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "signal", "sync"] }
rustls             = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots       = "0.26"
tokio-tungstenite  = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util       = { version = "0.3", default-features = false, features = ["sink", "std"] }
# MTProto obfuscated2 (AES-256-CTR) + QUIC Initial decryption (AES-128-GCM / HKDF)
aes                = "0.8"
ctr                = "0.9"
aes-gcm            = "0.10"
hkdf               = "0.12"
sha2               = "0.10"
# stateful NAT for the transparent Telegram redirect
dashmap            = "6"
arc-swap           = "1"
fastrand           = "2"
hex                = "0.4"
anyhow             = "1"
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
sha2 = "0.10"
zip  = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Build (on Windows):   cargo build --release
# Cross (from Linux):   cargo xwin build --release --target x86_64-pc-windows-msvc
# build.rs downloads WinDivert 2.2.2-A into vendor/windivert/ on first build, links
# WinDivert.lib (delay-loaded) and embeds WinDivert.dll + WinDivert64.sys into the exe.
# Run elevated (the driver needs Administrator).
